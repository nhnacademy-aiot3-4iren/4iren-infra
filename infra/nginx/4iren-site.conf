upstream frontend {
    least_conn;
    server team4-front-1:8080 max_fails=3 fail_timeout=10s;
    server team4-front-2:8080 max_fails=3 fail_timeout=10s;
}

upstream notification {
    least_conn;
    server team4-notification-1:8080 max_fails=3 fail_timeout=10s;
    server team4-notification-2:8080 max_fails=3 fail_timeout=10s;
}

server {
    # 80 포트로 요청을 받겠다
    # cloudflare가 처리하고 80포트로 요청을 보내줌
    listen 80;

    # domain name
    server_name 4iren.site www.4iren.site;

    # error log 기록
    error_log /var/log/nginx_custom/nginx-error.log warn;

    # 텔레그램 웹훅 (프론트보다 먼저 매칭돼야 함 - notification-service로 직행)
    location /telegram/ {
        proxy_pass http://notification/;
        proxy_next_upstream error timeout invalid_header http_500 http_502 http_503 http_504;
        proxy_next_upstream_tries 2;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }

    # main - frontend (기본 경로 설정)
    location / {
        # 요청이 오면 frontend 그룹으로 트래픽 보내기
        proxy_pass http://frontend;
        # 에러가 나거나 타임아웃 발생 시, 다른 살아있는 서버로 재시도
        proxy_next_upstream error timeout invalid_header http_500 http_502 http_503 http_504;
        # 재시도 횟수 제한 - 최대 2번
        proxy_next_upstream_tries 2;
        # 백엔드에 요청을 보낼때, 무슨 도메인을 타고 왔는지 포함해서 보내기
        proxy_set_header Host $host;
        # 요청 보낸 곳의 실제 IP 주소를 포함해서 보내기
        # 추후 악성 유저 IP 차단 등으로 사용 가능성
        proxy_set_header X-Real-IP $remote_addr;
        # 요청이 지나온 프록시 정보를 포함 (IP 주소를 쉼표로 연결)
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        # 접속할때 사용한 프로토콜 명시 (HTTP or HTTPS)
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}